# The public website on GitHub Pages. Every deploy re-runs CI-eligible recipes from the original data and builds
# the static site of publicly released packs.
name: site
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, labeled]
  schedule:
    - cron: "17 7 * * *"          # daily: refresh vote counts (thumbs-ups don't trigger workflows)
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/runpapers/data
          key: rp-data-${{ hashFiles('papers/**/pack.toml') }}
          restore-keys: rp-data-
      - name: Re-run CI-eligible pack recipes from the original data
        run: uvx --from . rp verify --all --no-cap || echo "some packs did not pass"
      - name: Snapshot the paper requests (issues labelled "request") and their votes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from . rp requests --sync --json > /dev/null || echo "request sync failed; the site shows the last known requests"
      - name: Build the site
        run: uvx --from . rp site build --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

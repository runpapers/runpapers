[project]
name = "runpapers"
version = "0.1.0"
description = "Verified, agent-ready packs that let any AI agent reproduce a paper's figures and answer new questions with its data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "RunPapers contributors" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.6"]

[project.scripts]
rp = "runpapers.cli:main"
runpapers = "runpapers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runpapers"]

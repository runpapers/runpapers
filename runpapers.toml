# RunPapers registry root (this file marks it).
name = "RunPapers"

[site]
# The website (GitHub Pages with the custom domain runpapers.com, DNS at Cloudflare). The install command switches to
# "uvx runpapers" once the package is on PyPI.
base_url = "https://runpapers.com"
install_cmd = "uvx --from git+https://github.com/runpapers/runpapers runpapers"

[publish]
github_repo = "runpapers/runpapers"
hf_org = "RunPapers"                # Hugging Face organization (datasets at huggingface.co/datasets/RunPapers/<DOI slug>)
creator = "RunPapers"               # Zenodo creator and the name on sign-offs
zenodo_community = "runpapers"      # zenodo.org/communities/runpapers (the PI owns it)

[verify]
min_agent_families = 2              # agent-tested needs passing naive-user runs from >= 2 companies

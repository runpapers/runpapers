# Held-out test questions. Answers were computed twice: by the recipes and by independent code that does not
# use this pack (2026-11-24). These files are never copied into a user's workspace.

[[question]]
id = "q1"
ask = "Pooled across human, macaque and marmoset, what percentage of classical D2 spiny projection neurons (the four STR D2 Groups) belong to the STR D2 SMYD2-HTR7 SPN Group?"
answer = 3.49
tolerance = { abs = 0.05 }
kind = "number"
level = "reproduce"
source = "recipe fig2f metric smyd2_pct_of_d2_pooled (3.4907); independent count 3.491"
public = true

[[question]]
id = "q2"
ask = "How many nuclei in the consensus basal ganglia atlas come from marmoset?"
answer = 313033
tolerance = { exact = true }
kind = "number"
level = "reproduce"
source = "recipe fig1b metric n_nuclei_marmoset; Table S1"
public = true

[[question]]
id = "q3"
ask = "In which species is the STR D2 SMYD2-HTR7 SPN share of classical D2 SPNs lowest (pooling all of that species' nuclei)? Answer with the species name."
answer = "Marmoset"
contains_any = ["marmoset", "callithrix"]
kind = "text"
level = "new"
source = "independent count: human 3.67%, macaque 3.69%, marmoset 2.19%"
public = true


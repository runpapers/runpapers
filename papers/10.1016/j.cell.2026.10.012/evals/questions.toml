# Held-out test questions for Johansen et al., Cell 2026 (10.1016/j.cell.2026.10.012).
# Every answer was computed twice: by the recipes and by independent code that does not import the pack.
# Never shipped to users.

[[question]]
id = "q1"
ask = "Pooled across human, macaque and marmoset, what percentage of classical D2 spiny projection neurons (the four STR D2 Groups) belong to the STR D2 SMYD2-HTR7 SPN Group?"
answer = 3.49
tolerance = { abs = 0.05 }
kind = "number"
level = "reproduce"
source = "recipe fig2f metric smyd2_pct_of_d2_pooled (3.4907); independent count 3.491"
public = true


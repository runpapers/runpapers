# ---- Figure 2F: D2 SPN Group proportions per donor (main text p.6-7; Figure 2F; Table S9)
[[target]]
recipe = "fig2f"
metric = "smyd2_pct_of_d2_pooled"
expected = 3.4
tolerance = { range = [3.40, 3.50] }
source = "main text p.7: 'comprising only 3.4% of classical STR D2 SPNs (Figure 2F)'"
kind = "figure"
note = "Main text p.7 writes '3.4%' by truncating 3.49% to one decimal place (similar to writing 1,896,133 nuclei as '1.8 million'); the truncation interval [3.40, 3.50] covers values that truncate to 3.4%."

[[target]]
recipe = "fig2f"
metric = "smyd2_pct_of_spn_pooled"
expected = 1.0
tolerance = { abs = 0.3 }
source = "main text p.7: 'and 1% of all SPNs (Figure S9; Table S9)'"
kind = "discrepancy"
required = false
note = "Table S9 cell-level sheet totals 848,201 SPN nuclei including OT ICj Granule (13,483 / 848,201 = 1.59%), whereas the 9 classical and eccentric SPN Groups total 841,005 nuclei (13,483 / 841,005 = 1.60%). Table S9 donor-level means are 1.49% (human), 1.66% (macaque), and 1.03% (marmoset), making the marmoset donor mean a plausible source of the text's '1%'; kept as a documented discrepancy."

[[target]]
recipe = "fig2f"
metric = "n_smyd2_human"
expected = 7627
tolerance = { exact = true }
source = "Table S1.Human_qc_Group; Table S9 cell-level counts"
kind = "tally"


spec = "runpapers/0.1"

[paper]
doi = "10.1016/j.cell.2026.10.012"
pmid = "43020019"
pmcid = ""
preprint_doi = "10.64898/2025.12.15.694496"
title = "Cross-species multiomic atlas of the primate basal ganglia"
first_author = "Nelson J. Johansen"
senior_author = "Trygve E. Bakken"
journal = "Cell"
year = 2026
license = "CC-BY-NC-ND-4.0"   # Crossref VoR license: published figure images are not redistributed; the paper's license (e.g. CC-BY-4.0): decides whether published figure images may be shown
collections = ["bican-2026"]

[pack]
version = "0.1.0"
summary = "A consensus cell-type taxonomy of the basal ganglia from 1,896,133 nuclei (~1.9 million; referred to as '1.8 million' in the paper's text) across human, macaque and marmoset (61 Groups), with conserved and species-specific features. This pack reproduces the atlas tallies and Group composition (Fig 1B) and the rare STR D2 SMYD2-HTR7 SPN population (Fig 2F) from the public metadata on a laptop."
license = "CC-BY-4.0"   # pack content; recipe code is MIT
code_license = "MIT"
maintainers = [{ name = "RunPapers maintainers", orcid = "" }]

[profile]               # structured description used for search and agent meetings (use ontology terms)
species = ["Homo sapiens", "Macaca mulatta", "Macaca nemestrina", "Callithrix jacchus"]
tissues = ["caudate nucleus", "putamen", "nucleus accumbens", "globus pallidus", "subthalamic nucleus", "substantia nigra"]
assays = ["10x Multiome snRNA-seq", "10x Multiome snATAC-seq", "MERSCOPE", "Xenium", "Patch-seq"]
cell_types = ["spiny projection neuron", "D1 SPN", "D2 SPN", "eccentric SPN", "astrocyte", "microglia", "oligodendrocyte"]
key_genes = ["SMYD2", "HTR7", "DRD1", "DRD2", "RXFP1", "ADORA2A"]


spec = "runpapers/0.2"

[paper]
doi = "10.1016/j.cell.2026.10.012"
pmid = "43020019"
pmcid = ""
preprint_doi = "10.64898/2025.12.15.694496"
title = "Cross-species multiomic atlas of the primate basal ganglia"
first_author = "Nelson J. Johansen"
senior_author = "Trygve E. Bakken"
journal = "Cell"
year = 2026
license = "CC-BY-NC-ND-4.0"   # Crossref VoR license: published figure images are not redistributed
collections = ["bican-2026"]

[pack]
version = "0.2.0"
summary = "A consensus multiomic and spatial atlas of the primate basal ganglia across 1,896,133 single nuclei (referred to as '1.8 million' in the text) from 10 human, 8 macaque, and 4 marmoset donors (61 consensus Groups), paired with primate MERSCOPE/Xenium and mouse MERFISH spatial maps, macaque Patch-seq electrophysiology, primate snATAC-seq chromatin landscapes, DeepHumanBG sequence-to-accessibility models, and MAGMA disease-genetics enrichment across 31 main-figure recipes."
license = "CC-BY-4.0"   # pack content; recipe code is MIT
code_license = "MIT"
maintainers = [{ name = "RunPapers maintainers", orcid = "" }]

[profile]
species = ["Homo sapiens", "Macaca mulatta", "Macaca nemestrina", "Callithrix jacchus", "Mus musculus"]
tissues = ["caudate nucleus", "putamen", "nucleus accumbens", "globus pallidus", "subthalamic nucleus", "substantia nigra", "olfactory bulb"]
assays = ["10x Multiome snRNA-seq", "10x Multiome snATAC-seq", "MERSCOPE", "Xenium", "MERFISH", "Patch-seq", "MAGMA GWAS enrichment", "CREsted sequence modeling"]
cell_types = ["spiny projection neuron", "D1 SPN", "D2 SPN", "eccentric SPN", "STR D2 SMYD2-HTR7 SPN", "cholinergic interneuron", "PVALB interneuron", "SST-CHODL interneuron", "globus pallidus neuron", "dopaminergic neuron", "olfactory bulb neuron", "astrocyte", "microglia", "oligodendrocyte"]
key_genes = ["SMYD2", "HTR7", "DRD1", "DRD2", "RXFP1", "ADORA2A", "MCHR2", "KCNIP1", "OPRM1", "CNR1", "CACNA1I", "MEIS2", "EGR1", "RARB", "LHX8", "GBX2", "ZIC3", "POU3F1", "HINFP"]

